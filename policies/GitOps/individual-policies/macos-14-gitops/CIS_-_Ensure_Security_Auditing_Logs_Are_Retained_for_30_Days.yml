- name: CIS - Ensure Security Auditing Logs Are Retained for 30 Days
  platform: darwin
  description: |
    The macOS audit capability contains important information to investigate security or operational issues. This resource is only completely useful if it is retained long enough to allow technical staff to find the root cause of anomalies in the records.
    Retention can be set to respect both size and longevity. The recommendation is to retain audit logs for at least 30 days:
    expire-after:30d
    This recommendation is based on the minimum number of days retained for review and investigation. If your organization has storage constraints, you can add a storage value limit in addition to the days retained, for example: expire-after:30d OR 5G. When a third party tool is in use to allow remote logging or the store and forwarding of logs, this local storage is a supplemental source of data.
  resolution: |
    Automated method:
    Ask your system administrator to deploy the following script, which ensures audit logs are retained for at least 30 days. It writes to a unique temp file and atomically replaces /etc/security/audit_control only on success:
    TMP="$(/usr/bin/mktemp /tmp/audit_control.XXXXXX)" && \
    /usr/bin/sudo /usr/bin/awk '/^expire-after:/ { print "expire-after:30d"; found=1; next } { print } END { if (!found) print "expire-after:30d" }' /etc/security/audit_control > "$TMP" && \
    /usr/bin/sudo /bin/mv "$TMP" /etc/security/audit_control && \
    /usr/bin/sudo /usr/sbin/chown root:wheel /etc/security/audit_control && \
    /usr/bin/sudo /bin/chmod 0400 /etc/security/audit_control
  query: |
    SELECT 1 WHERE EXISTS (
      SELECT 1
      FROM file_lines
      WHERE path = '/etc/security/audit_control'
      AND line LIKE 'expire-after:%'
      AND CAST(regex_match(line, 'expire-after:\s*(\d+)d', 1) AS INTEGER) >= 30
    );
