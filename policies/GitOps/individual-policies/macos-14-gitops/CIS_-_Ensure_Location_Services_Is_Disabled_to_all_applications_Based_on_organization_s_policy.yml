- name: CIS - Ensure Location Services Is Disabled to all applications (Based on organization's policy)
  platform: darwin
  description: "macOS uses location information gathered through local Wi-Fi networks to enable applications to supply relevant information to users. While Location Services may be very useful, it may not be desirable to allow all applications that can use Location Services to use your location for Internet queries in order to provide tailored content based on your current location.\nEnsure applications that can use Location Services are authorized and provide that information where the application interacts with external systems. Apple offers feedback within System Preferences and may be enabled to supply information on the menu bar when Location Services are used.\nSafari can deny access from websites or prompt for access.\nApplications that support Location Services can be individually controlled in the Privacy tab in Security & Privacy under System Preferences.\nAccess should be evaluated to ensure that privacy controls are as expected.\nThis query verifies that location services is disabled for all apps.    \n"
  resolution: |
    Graphical Method:
        Perform the following steps to disable unnecessary applications from accessing Location Services:
        1. Open System Settings
        2. Select Privacy & Security
        3. Select Location Services
        4. Set Location Services to disabled.
  query: SELECT 1 FROM location_services WHERE enabled = 0;
