- name: CIS - Ensure 'Audit Process Creation' is set to include 'Success'
  platform: windows
  description: |
    Creates audit events whenever a process is executed.
    This makes it easier to investigate a future security incident if required.
  resolution: |
    Automatic method:
    Ask your system administrator to establish the recommended configuration via GP, set the following UI path to 'Success':
    'Computer Configuration\Policies\Windows Settings\Security Settings\Advanced Audit Policy Configuration\Audit Policies\Detailed Tracking\Audit Process Creation'
  query: "SELECT 1 FROM mdm_bridge where mdm_command_input =\n\"<SyncBody><Get><CmdID>1</CmdID><Item><Target><LocURI>./Device/Vendor/MSFT/Policy/Result/Audit/DetailedTracking_AuditProcessCreation</LocURI></Target></Item></Get></SyncBody>\" \nAND (mdm_command_output = \"1\" OR mdm_command_output = \"3\");\n"
