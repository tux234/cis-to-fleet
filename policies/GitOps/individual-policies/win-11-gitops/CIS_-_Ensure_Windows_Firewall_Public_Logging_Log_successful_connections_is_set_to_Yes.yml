- name: |
    CIS - Ensure 'Windows Firewall: Public: Logging: Log successful connections' is set to 'Yes'
  platform: windows
  description: |
    Use this option to log when Windows Firewall with Advanced Security allows an inbound connection. The log records why and when the connection was formed. Look for entries with the word ALLOW in the action column of the log.
    The recommended state for this setting is: Yes.
  resolution: |
    To establish the recommended configuration via GP, set the following UI path to Yes.
    'Computer Configuration\Policies\Windows Settings\Security Settings\Windows Defender Firewall with Advanced Security\Windows Defender Firewall with Advanced Security - Local Group Policy Object\Windows Defender Firewall Properties\Public Profile\Logging Customize\Log successful connections'
  query: |
    SELECT 1 FROM registry WHERE (key = 'HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\PublicProfile\\Logging\LogSuccessfulConnections' and data == 1 );
