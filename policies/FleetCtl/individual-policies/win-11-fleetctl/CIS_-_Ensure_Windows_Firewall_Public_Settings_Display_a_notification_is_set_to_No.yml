apiVersion: v1
kind: policy
spec:
  name: CIS - Ensure 'Windows Firewall: Public: Settings: Display a notification' is set to 'No'
  query: SELECT 1 FROM registry WHERE (path = 'HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\WindowsFirewall\\PublicProfile\DisableNotifications' and data == 0);
  critical: false
  description: |
    Select this option to have Windows Firewall with Advanced Security display notifications to the user when a program is blocked from receiving inbound connections.
    The recommended state for this setting is: No.
  resolution: |
    To establish the recommended configuration via GP, set the following UI path to 'No':
    'Computer Configuration\Policies\Windows Settings\Security Settings\Windows Defender Firewall with Advanced Security\Windows Defender Firewall with Advanced Security - Local Group Policy Object\Windows Defender Firewall Properties\Public Profile\Settings Customize\Display a notification'
  platform: windows
