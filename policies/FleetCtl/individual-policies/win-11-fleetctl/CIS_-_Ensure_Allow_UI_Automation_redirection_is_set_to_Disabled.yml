apiVersion: v1
kind: policy
spec:
  name: CIS - Ensure 'Allow UI Automation redirection' is set to 'Disabled'
  query: SELECT 1 FROM registry WHERE (path = 'HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows NT\\Terminal Services\\EnableUiaRedirection' AND data = 0);
  critical: false
  description: This policy setting determines whether User Interface (UI) Automation client applications running on the local computer can access UI elements on the server.
  resolution: |
    To establish the recommended configuration via GP, set the following UI path to 'Disabled':
    'Computer Configuration\\Administrative Templates\\Windows Components\\Remote Desktop Services\\Remote Desktop Session Host\\Device and Resource Redirection\\Allow UI Automation redirection'
  platform: windows
