apiVersion: v1
kind: policy
spec:
  name: CIS - Ensure 'Allow Remote Shell Access' is set to 'Disabled'
  query: SELECT 1 FROM registry WHERE (path = 'HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\WinRM\\Service\\WinRS\\AllowRemoteShellAccess' AND data = 0);
  critical: false
  description: This policy setting allows you to manage configuration of remote access to all supported shells to execute scripts and commands.
  resolution: |
    To establish the recommended configuration via GP, set the following UI path to 'Disabled':
    'Computer Configuration\Policies\Administrative Templates\Windows Components\Windows Remote Shell\Allow Remote Shell Access'
  platform: windows
