apiVersion: v1
kind: policy
spec:
  name: CIS - Ensure FileVault Is Enabled (MDM Required)
  query: |
    SELECT 1 WHERE
      EXISTS (
        SELECT 1 FROM managed_policies WHERE
          domain = 'com.apple.MCX' AND
          name = 'dontAllowFDEDisable' AND
          (value = 1 OR value = 'true') AND
          username = ''
      )
      AND NOT EXISTS (
        SELECT 1 FROM managed_policies WHERE
          domain = 'com.apple.MCX' AND
          name = 'dontAllowFDEDisable' AND
          (value != 1 AND value != 'true')
      )
      AND EXISTS (
        SELECT 1 FROM disk_encryption WHERE
          user_uuid IS NOT "" AND
          filevault_status = 'on'
      );
  critical: false
  description: FileVault secures a system's data by automatically encrypting its boot volume and requiring a password or recovery key to access it. FileVault should be used with a saved escrow key to ensure that the owner can decrypt their data if the password is lost. This policy checks that FileVault is enabled on the device and that the user is not allowed to disable it.
  resolution: |
    Graphical Method:
      1. Open System Settings
      2. Select Security & Privacy
      3. Select Turn On...
    
    Profile Method:
    Create or edit a configuration profile with the following information:
      - PayloadType: com.apple.MCX
      - Key: dontAllowFDEDisable
      - Value: <true/>
    
    Note: The profile is required to pass the audit. Enabling FileVault itself still requires user interaction at the device.
  platform: darwin
