apiVersion: v1
kind: policy
spec:
  name: CIS - Ensure install.log Is Retained for 365 or More Days and No Maximum Size
  query: |
    SELECT 1 WHERE
      EXISTS (
        SELECT line,
               CAST(regex_match(line, 'ttl=(\d+)', 1) AS INTEGER) AS val
        FROM file_lines
        WHERE path = '/etc/asl/com.apple.install'
          AND val >= 365
      )
      AND NOT EXISTS (
        SELECT line
        FROM file_lines
        WHERE path = '/etc/asl/com.apple.install'
          AND line LIKE '%all_max=%'
      );
  critical: false
  description: macOS writes information pertaining to system-related events to the file /var/log/install.log and has a configurable retention policy for this file. The default logging setting limits the file size of the logs and the maximum size for all logs. Archiving and retaining install.log for at least a year is beneficial in the event of an incident as it will allow the user to view the various changes to the system along with the date and time they occurred.
  resolution: |
    Terminal Method:
      Edit /etc/asl/com.apple.install and add or modify the ttl value to 365 or greater on the file line. Also remove the all_max= setting and value from the file line.
  platform: darwin
