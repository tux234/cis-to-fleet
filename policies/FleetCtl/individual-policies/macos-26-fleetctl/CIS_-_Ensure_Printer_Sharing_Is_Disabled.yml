apiVersion: v1
kind: policy
spec:
  name: CIS - Ensure Printer Sharing Is Disabled
  query: |
    SELECT 1 WHERE NOT EXISTS (
      SELECT 1 FROM listening_ports
      WHERE port = 631
        AND address NOT IN ('127.0.0.1', '::1', '')
    );
  critical: false
  description: By enabling Printer Sharing, the computer is set up as a print server to accept print jobs from other computers. Dedicated print servers or direct IP printing should be used instead.
  resolution: |
    Graphical Method:
      1. Open System Settings
      2. Select General
      3. Select Sharing
      4. Set Printer Sharing to disabled
    
    Terminal Method:
      /usr/bin/sudo /usr/sbin/cupsctl --no-share-printers
  platform: darwin
