apiVersion: v1
kind: policy
spec:
  name: CIS - Ensure a Login Window Banner Exists
  query: |
    SELECT 1 FROM file
    WHERE (path = '/Library/Security/PolicyBanner.txt' OR path = '/Library/Security/PolicyBanner.rtf')
      AND mode = '0644'
      AND uid = 0
      AND gid = 0;
  critical: false
  description: A Login window banner warning informs the user that the system is reserved for authorized use only. An access warning may reduce a casual attacker's tendency to target the system and may aid in the prosecution of an attacker by evincing the attacker's knowledge of the system's private status.
  resolution: |
    Terminal Method:
      Create /Library/Security/PolicyBanner.txt or PolicyBanner.rtf with the desired banner text.
      /usr/bin/sudo /usr/sbin/chown root:wheel /Library/Security/PolicyBanner.*
      /usr/bin/sudo /bin/chmod o+r /Library/Security/PolicyBanner.*
  platform: darwin
