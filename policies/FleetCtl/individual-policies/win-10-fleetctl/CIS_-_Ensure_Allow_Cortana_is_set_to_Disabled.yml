apiVersion: v1
kind: policy
spec:
  name: CIS - Ensure 'Allow Cortana' is set to 'Disabled'
  query: SELECT 1 FROM registry WHERE (path = 'HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\Windows Search\\AllowCortana' AND data = 0);
  critical: false
  description: This policy setting specifies whether Cortana is allowed on the device.
  resolution: |
    To establish the recommended configuration via GP, set the following UI path to 'Disabled':
    'Computer Configuration\Policies\Administrative Templates\Windows Components\Search\Allow Cortana'
  platform: windows
