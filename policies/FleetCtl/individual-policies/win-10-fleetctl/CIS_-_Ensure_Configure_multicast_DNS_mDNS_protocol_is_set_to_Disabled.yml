apiVersion: v1
kind: policy
spec:
  name: CIS - Ensure 'Configure multicast DNS (mDNS) protocol' is set to 'Disabled'
  query: SELECT 1 FROM registry WHERE (path = 'HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient\EnableMDNS' AND data = 0);
  critical: false
  description: |
    This policy setting determines if the DNS client will perform name resolution over Multicast DNS (mDNS), which performs local network name and service discovery without a central DNS server.
    The recommended state for this setting is: Disabled.
  resolution: |
    To establish the recommended configuration via GP, set the following UI path to 'Disabled':
    'Computer Configuration\Policies\Administrative Templates\Network\DNS Client\Configure multicast DNS (mDNS) protocol'
    Note: This Group Policy path may not exist by default. It is provided by the Group Policy template DnsClient.admx/adml that is included with the Microsoft Windows 11 Release 24H2 Administrative Templates (or newer).
  platform: windows
