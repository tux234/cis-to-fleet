apiVersion: v1
kind: policy
spec:
  name: CIS - Ensure 'Turn off Microsoft consumer experiences' is set to 'Enabled'
  query: SELECT 1 FROM registry WHERE (path = 'HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\CloudContent\DisableWindowsConsumerFeatures' AND data = 1);
  critical: false
  description: This policy setting turns off experiences that help consumers make the most of their devices and Microsoft account.
  resolution: |
    To establish the recommended configuration via GP, set the following UI path to Enabled:
    'Computer Configuration\Policies\Administrative Templates\Windows Components\Cloud Content\Turn off Microsoft consumer experiences'
  platform: windows
