apiVersion: v1
kind: policy
spec:
  name: CIS - Ensure 'GameInput Service (GameInputSvc)' is set to 'Disabled'
  query: SELECT 1 FROM registry WHERE (path = 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\GameInputSvc\Start' AND data = 4);
  critical: false
  description: |
    This service enables the use of keyboards, mice, gamepads, and other input devices with the GameInput API.
    The recommended state for this setting is: Disabled.
  resolution: |
    Automatic method:
    Ask your system administrator to establish the recommended configuration via domain GP, set the following UI path to 'Disabled':
    'Computer Configuration\Policies\Windows Settings\Security Settings\System Services\GameInput Service'
  platform: windows
