apiVersion: v1
kind: policy
spec:
  name: CIS - Ensure 'Allow network connectivity during connected-standby (plugged in)' is set to 'Disabled'
  query: SELECT 1 FROM registry WHERE (path = 'HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Power\\PowerSettings\\f15576e8-98b7-4186-b944-eafa664402d9\ACSettingIndex' AND data = 0);
  critical: false
  description: This policy setting allows you to control the network connectivity state in standby on modern standby-capable systems.
  resolution: |
    To establish the recommended configuration via GP, set the following UI path to Disabled:
    'Computer Configuration\Policies\Administrative Templates\System\Power Management\Sleep Settings\Allow network connectivity during connected-standby (plugged in)'
  platform: windows
