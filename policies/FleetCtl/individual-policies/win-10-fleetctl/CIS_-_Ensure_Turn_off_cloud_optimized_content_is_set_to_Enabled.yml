apiVersion: v1
kind: policy
spec:
  name: CIS - Ensure 'Turn off cloud optimized content' is set to 'Enabled'
  query: Select 1 FROM registry WHERE (path = 'HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\CloudContent\DisableCloudOptimizedContent' AND data = 1);
  critical: false
  description: This policy setting turns off cloud optimized content in all Windows experiences.
  resolution: |
    To establish the recommended configuration via GP, set the following UI path to Enabled:
    'Computer Configuration\Policies\Administrative Templates\Windows Components\Cloud Content\Turn off cloud optimized content'
  platform: windows
