apiVersion: v1
kind: policy
spec:
  name: CIS - Ensure 'Allow search and Cortana to use location' is set to 'Disabled'
  query: SELECT 1 FROM registry WHERE (path = 'HKEY_LOCAL_MACHINE\\SOFTWARE\\Policies\\Microsoft\\Windows\\Windows Search\\AllowSearchToUseLocation' AND data = 0);
  critical: false
  description: This policy setting specifies whether search and Cortana can provide location aware search and Cortana results.
  resolution: |
    To establish the recommended configuration via GP, set the following UI path to 'Disabled':
    'Computer Configuration\Policies\Administrative Templates\Windows Components\Search\Allow search and Cortana to use location'
  platform: windows
