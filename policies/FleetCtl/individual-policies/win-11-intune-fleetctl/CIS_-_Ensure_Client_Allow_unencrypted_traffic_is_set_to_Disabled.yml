apiVersion: v1
kind: policy
spec:
  name: CIS - Ensure Client 'Allow unencrypted traffic' is set to 'Disabled'
  query: SELECT 1 FROM registry WHERE path = 'HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WinRM\Client\AllowUnencryptedTraffic' AND data = '0';
  critical: false
  description: "\nThis policy setting allows you to manage whether the Windows Remote Management\n(WinRM) client sends and receives unencrypted messages over the network.\nThe recommended state for this setting is: Disabled."
  resolution: "\nTo establish the recommended configuration via configuration profiles, set the following\nSettings Catalog path to Disabled.\nAdministrative Templates\\Windows Components\\Windows Remote Management\n(WinRM)\\WinRM Client\\Allow unencrypted traffic"
  platform: windows
