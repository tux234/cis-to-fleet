name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test CIS-to-Fleet Script
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl jq
          
          # Install yq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Verify dependencies
        run: |
          curl --version
          jq --version
          yq --version

      - name: Make script executable
        run: chmod +x ./cis-to-fleet.sh

      - name: Test script syntax
        run: bash -n ./cis-to-fleet.sh

      - name: Test help command
        run: ./cis-to-fleet.sh help

      - name: Test version command
        run: ./cis-to-fleet.sh version

      - name: Test platform discovery
        run: ./cis-to-fleet.sh list

      - name: Test GitOps format generation
        run: |
          ./cis-to-fleet.sh generate macos-15 gitops --output test_output --force
          
          # Verify output file exists
          if [[ ! -f test_output/cis-benchmark-macos15-gitops.yml ]]; then
            echo "❌ GitOps output file not generated"
            exit 1
          fi
          
          # Verify YAML is valid
          yq eval '.' test_output/cis-benchmark-macos15-gitops.yml > /dev/null
          echo "✅ GitOps YAML is valid"

      - name: Test Fleetctl format generation
        run: |
          ./cis-to-fleet.sh generate macos-15 fleetctl --output test_output --force
          
          # Verify output file exists
          if [[ ! -f test_output/cis-benchmark-macos15-fleetctl.yml ]]; then
            echo "❌ Fleetctl output file not generated"
            exit 1
          fi
          
          # Verify YAML is valid
          yq eval '.' test_output/cis-benchmark-macos15-fleetctl.yml > /dev/null
          echo "✅ Fleetctl YAML is valid"

      - name: Test CIS level filtering
        run: |
          # Test Level 1 filtering
          ./cis-to-fleet.sh generate macos-15 gitops --level 1 --output test_output --force
          level1_policies=$(yq eval '. | length' test_output/cis-benchmark-macos15-gitops.yml)
          
          # Test Level 2 filtering  
          ./cis-to-fleet.sh generate macos-15 gitops --level 2 --output test_output --force
          level2_policies=$(yq eval '. | length' test_output/cis-benchmark-macos15-gitops.yml)
          
          echo "✅ Level 1 policies: $level1_policies"
          echo "✅ Level 2 policies: $level2_policies"

      - name: Test split file generation
        run: |
          ./cis-to-fleet.sh generate macos-15 gitops split --output test_output --force
          
          # Verify split files directory exists
          if [[ ! -d test_output/macos-15-gitops ]]; then
            echo "❌ Split files directory not created"
            exit 1
          fi
          
          # Count generated files
          split_files=$(find test_output/macos-15-gitops -name "*.yml" | wc -l)
          echo "✅ Generated $split_files individual policy files"

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: test_output/
          retention-days: 7

  shellcheck:
    name: ShellCheck Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          scandir: '.'
          format: gcc

  security-scan:
    name: Security Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'